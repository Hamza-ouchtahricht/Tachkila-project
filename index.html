  <div id="modal-overlay" class="modal-overlay">

    
        <div class="modal">

     
        <div class="modal__header">
        <h2 class="modal__title">Ajouter un joueur</h2>
        <button id="btn-fermer-modal" class="modal__close" aria-label="Fermer">&times;</button>
      </div>

      
      <form id="form-joueur" class="modal__form">

        
        <div class="form-group">
          <label for="player_fullname">Nom complet du joueur</label>
          <input
            type="text"
            id="player_fullname"
            placeholder="Ex : Cristiano Ronaldo"
            required
          />
        </div>

        
        <div class="form-group">
          <label for="select_position">Poste</label>
          <select id="select_position" required>
            <option value="" selected disabled>Choisir un poste</option>
            <option value="GK">GK — Gardien</option>
            <option value="LB">LB — Défenseur gauche</option>
            <option value="CB">CB — Défenseur central 1</option>
            <option value="CB2">CB — Défenseur central 2</option>
            <option value="RB">RB — Défenseur droit</option>
            <option value="LMF">LMF — Milieu gauche</option>
            <option value="CMF">CMF — Milieu central 1</option>
            <option value="CMF2">CMF — Milieu central 2</option>
            <option value="RMF">RMF — Milieu droit</option>
            <option value="CF">CF — Buteur 1</option>
            <option value="CF2">CF — Buteur 2</option>
          </select>
        </div>

        
        <div class="form-group">
          <label for="player_number">Numéro (1 to 99)</label>
          <input
            type="number"
            id="player_number"
            placeholder="Ex : 10"
            min="1"
            max="99"
            required
          />
        </div>

        
        <div class="modal__actions">
          <button type="button" id="btn-annuler" class="btn btn--cancel">Annuler</button>
          <button type="submit" class="btn btn--save">Enregistrer</button>
        </div>

      </form>
